<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" style="background-color:#1e1e2e; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="800" y="45" text-anchor="middle" fill="#cdd6f4" font-size="24" font-weight="bold">Duolingo Database - Entity Relationship Diagram</text>
  <text x="800" y="72" text-anchor="middle" fill="#a6adc8" font-size="14">Course: DBMS · Schema: duolingo · Team T0117</text>

  <!-- Languages -->
  <g transform="translate(50, 100)" filter="url(#shadow)">
    <rect width="220" height="100" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="220" height="32" rx="8" fill="#45475a"/>
    <text x="110" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">languages</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="40" y="55" fill="#cdd6f4" font-size="12">language_code (VARCHAR)</text>
    <text x="40" y="80" fill="#a6adc8" font-size="12">language_name (VARCHAR)</text>
  </g>

  <!-- Courses -->
  <g transform="translate(350, 100)" filter="url(#shadow)">
    <rect width="240" height="160" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="240" height="32" rx="8" fill="#45475a"/>
    <text x="120" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">courses</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="40" y="55" fill="#cdd6f4" font-size="12">course_id (INT)</text>
    <text x="15" y="80" fill="#fab387" font-size="12" font-weight="bold">FK</text>
    <text x="40" y="80" fill="#cdd6f4" font-size="12">from_lang (VARCHAR)</text>
    <text x="15" y="105" fill="#fab387" font-size="12" font-weight="bold">FK</text>
    <text x="40" y="105" fill="#cdd6f4" font-size="12">learning_lang (VARCHAR)</text>
    <text x="40" y="130" fill="#a6adc8" font-size="12">title (VARCHAR)</text>
    <text x="40" y="150" fill="#a6adc8" font-size="12">launched_on (DATE)</text>
  </g>

  <!-- Units -->
  <g transform="translate(670, 100)" filter="url(#shadow)">
    <rect width="220" height="155" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="220" height="32" rx="8" fill="#45475a"/>
    <text x="110" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">units</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="40" y="55" fill="#cdd6f4" font-size="12">unit_id (INT)</text>
    <text x="15" y="80" fill="#fab387" font-size="12" font-weight="bold">FK</text>
    <text x="40" y="80" fill="#cdd6f4" font-size="12">course_id (INT)</text>
    <text x="40" y="105" fill="#a6adc8" font-size="12">unit_no (INT)</text>
    <text x="40" y="128" fill="#a6adc8" font-size="12">title (VARCHAR)</text>
    <text x="40" y="148" fill="#a6adc8" font-size="12">cefr_level (VARCHAR)</text>
  </g>

  <!-- Lessons -->
  <g transform="translate(970, 100)" filter="url(#shadow)">
    <rect width="220" height="155" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="220" height="32" rx="8" fill="#45475a"/>
    <text x="110" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">lessons</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="40" y="55" fill="#cdd6f4" font-size="12">lesson_id (INT)</text>
    <text x="15" y="80" fill="#fab387" font-size="12" font-weight="bold">FK</text>
    <text x="40" y="80" fill="#cdd6f4" font-size="12">unit_id (INT)</text>
    <text x="40" y="105" fill="#a6adc8" font-size="12">lesson_no (INT)</text>
    <text x="40" y="128" fill="#a6adc8" font-size="12">lesson_type (VARCHAR)</text>
    <text x="40" y="148" fill="#a6adc8" font-size="12">xp_value (INT)</text>
  </g>

  <!-- Learners -->
  <g transform="translate(350, 360)" filter="url(#shadow)">
    <rect width="260" height="225" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <rect width="260" height="32" rx="8" fill="#45475a"/>
    <text x="130" y="22" text-anchor="middle" fill="#a6e3a1" font-weight="bold" font-size="14">learners</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="40" y="55" fill="#cdd6f4" font-size="12">learner_id (INT)</text>
    <text x="15" y="78" fill="#cba6f7" font-size="12" font-weight="bold">UQ</text>
    <text x="40" y="78" fill="#cdd6f4" font-size="12">username (VARCHAR)</text>
    <text x="15" y="100" fill="#cba6f7" font-size="12" font-weight="bold">UQ</text>
    <text x="40" y="100" fill="#cdd6f4" font-size="12">email (VARCHAR)</text>
    <text x="40" y="122" fill="#a6adc8" font-size="12">country_code (VARCHAR)</text>
    <text x="40" y="144" fill="#a6adc8" font-size="12">daily_goal_xp (INT)</text>
    <text x="40" y="166" fill="#a6adc8" font-size="12">subscription (VARCHAR)</text>
    <text x="15" y="188" fill="#fab387" font-size="12" font-weight="bold">FK</text>
    <text x="40" y="188" fill="#cdd6f4" font-size="12">referred_by (INT - Self FK)</text>
    <text x="40" y="210" fill="#a6adc8" font-size="12">joined_at (TIMESTAMPTZ)</text>
  </g>

  <!-- Enrollments -->
  <g transform="translate(50, 360)" filter="url(#shadow)">
    <rect width="230" height="155" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="230" height="32" rx="8" fill="#45475a"/>
    <text x="115" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">enrollments</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK,FK</text>
    <text x="60" y="55" fill="#cdd6f4" font-size="12">learner_id (INT)</text>
    <text x="15" y="80" fill="#f38ba8" font-size="12" font-weight="bold">PK,FK</text>
    <text x="60" y="80" fill="#cdd6f4" font-size="12">course_id (INT)</text>
    <text x="60" y="105" fill="#a6adc8" font-size="12">enrolled_at (TIMESTAMPTZ)</text>
    <text x="60" y="128" fill="#a6adc8" font-size="12">total_xp (INT)</text>
    <text x="60" y="148" fill="#a6adc8" font-size="12">is_active (BOOLEAN)</text>
  </g>

  <!-- Lesson Attempts -->
  <g transform="translate(970, 360)" filter="url(#shadow)">
    <rect width="250" height="260" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#45475a"/>
    <text x="125" y="22" text-anchor="middle" fill="#f9e2af" font-weight="bold" font-size="14">lesson_attempts</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="40" y="55" fill="#cdd6f4" font-size="12">attempt_id (BIGINT)</text>
    <text x="15" y="78" fill="#fab387" font-size="12" font-weight="bold">FK</text>
    <text x="40" y="78" fill="#cdd6f4" font-size="12">learner_id (INT)</text>
    <text x="15" y="100" fill="#fab387" font-size="12" font-weight="bold">FK</text>
    <text x="40" y="100" fill="#cdd6f4" font-size="12">lesson_id (INT)</text>
    <text x="40" y="122" fill="#a6adc8" font-size="12">started_at (TIMESTAMPTZ)</text>
    <text x="40" y="144" fill="#a6adc8" font-size="12">completed_at (TIMESTAMPTZ)</text>
    <text x="40" y="166" fill="#a6adc8" font-size="12">mistakes (INT)</text>
    <text x="40" y="188" fill="#a6adc8" font-size="12">hearts_lost (INT)</text>
    <text x="40" y="210" fill="#a6adc8" font-size="12">xp_earned (INT)</text>
    <text x="40" y="230" fill="#a6adc8" font-size="12">is_perfect (BOOLEAN)</text>
    <text x="40" y="250" fill="#a6adc8" font-size="12">device (VARCHAR)</text>
  </g>

  <!-- Daily Activity -->
  <g transform="translate(50, 700)" filter="url(#shadow)">
    <rect width="240" height="160" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="240" height="32" rx="8" fill="#45475a"/>
    <text x="120" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">daily_activity</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK,FK</text>
    <text x="60" y="55" fill="#cdd6f4" font-size="12">learner_id (INT)</text>
    <text x="15" y="80" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="60" y="80" fill="#cdd6f4" font-size="12">activity_date (DATE)</text>
    <text x="60" y="105" fill="#a6adc8" font-size="12">xp (INT)</text>
    <text x="60" y="130" fill="#a6adc8" font-size="12">lessons_completed (INT)</text>
    <text x="60" y="150" fill="#a6adc8" font-size="12">used_streak_freeze (BOOL)</text>
  </g>

  <!-- League Memberships -->
  <g transform="translate(350, 700)" filter="url(#shadow)">
    <rect width="250" height="200" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#45475a"/>
    <text x="125" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">league_memberships</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK,FK</text>
    <text x="60" y="55" fill="#cdd6f4" font-size="12">learner_id (INT)</text>
    <text x="15" y="80" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="60" y="80" fill="#cdd6f4" font-size="12">week_start (DATE)</text>
    <text x="60" y="105" fill="#a6adc8" font-size="12">tier (VARCHAR)</text>
    <text x="60" y="128" fill="#a6adc8" font-size="12">cohort_id (INT)</text>
    <text x="60" y="150" fill="#a6adc8" font-size="12">weekly_xp (INT)</text>
    <text x="60" y="172" fill="#a6adc8" font-size="12">final_rank (INT)</text>
    <text x="60" y="192" fill="#a6adc8" font-size="12">result (VARCHAR)</text>
  </g>

  <!-- Achievements -->
  <g transform="translate(1000, 700)" filter="url(#shadow)">
    <rect width="220" height="120" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="220" height="32" rx="8" fill="#45475a"/>
    <text x="110" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">achievements</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK</text>
    <text x="40" y="55" fill="#cdd6f4" font-size="12">achievement_id (INT)</text>
    <text x="15" y="80" fill="#cba6f7" font-size="12" font-weight="bold">UQ</text>
    <text x="40" y="80" fill="#cdd6f4" font-size="12">code (VARCHAR)</text>
    <text x="40" y="105" fill="#a6adc8" font-size="12">name (VARCHAR)</text>
  </g>

  <!-- Learner Achievements -->
  <g transform="translate(670, 700)" filter="url(#shadow)">
    <rect width="250" height="130" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#45475a"/>
    <text x="125" y="22" text-anchor="middle" fill="#89dceb" font-weight="bold" font-size="14">learner_achievements</text>
    <text x="15" y="55" fill="#f38ba8" font-size="12" font-weight="bold">PK,FK</text>
    <text x="60" y="55" fill="#cdd6f4" font-size="12">learner_id (INT)</text>
    <text x="15" y="80" fill="#f38ba8" font-size="12" font-weight="bold">PK,FK</text>
    <text x="60" y="80" fill="#cdd6f4" font-size="12">achievement_id (INT)</text>
    <text x="60" y="105" fill="#a6adc8" font-size="12">earned_at (TIMESTAMPTZ)</text>
  </g>

  <!-- Connecting Lines -->
  <!-- languages -> courses -->
  <path d="M 270 150 L 350 150" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- courses -> units -->
  <path d="M 590 150 L 670 150" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- units -> lessons -->
  <path d="M 890 150 L 970 150" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- courses -> enrollments -->
  <path d="M 400 260 L 400 320 L 160 320 L 160 360" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- learners -> enrollments -->
  <path d="M 350 420 L 280 420" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- learners -> lesson_attempts -->
  <path d="M 610 460 L 970 460" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- lessons -> lesson_attempts -->
  <path d="M 1080 255 L 1080 360" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- learners -> daily_activity -->
  <path d="M 400 585 L 400 660 L 170 660 L 170 700" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- learners -> league_memberships -->
  <path d="M 460 585 L 460 700" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- learners -> learner_achievements -->
  <path d="M 520 585 L 520 660 L 750 660 L 750 700" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <!-- achievements -> learner_achievements -->
  <path d="M 1000 750 L 920 750" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

</svg>